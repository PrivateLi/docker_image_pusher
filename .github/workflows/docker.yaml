name: Docker

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: '是否强制全量重新同步所有镜像'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'images.txt'
      - '.github/workflows/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull and Push
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Tune Docker daemon concurrency
        run: |
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-downloads": 10, "max-concurrent-uploads": 10}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and push image Aliyun
        run: |
          set -e
          docker login -u "$ALIYUN_REGISTRY_USER" -p "$ALIYUN_REGISTRY_PASSWORD" "$ALIYUN_REGISTRY"

          # 清理可能存在的 Windows 回车符 \r
          sed -i 's/\r$//' images.txt

          declare -A duplicate_images
          declare -A temp_map

          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" == \#* ]] && continue

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          FORCE_SYNC="${{ github.event.inputs.force_sync }}"

          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" == \#* ]] && continue

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]] && [[ -n "${name_space}" ]]; then
              name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # 增量检查：如果非强制全量同步，且目标镜像（非 latest）已存在于阿里云，则直接跳过
            if [[ "$FORCE_SYNC" != "true" && "$image_name_tag" != *":latest" && "$image_name_tag" == *":"* ]]; then
              if docker manifest inspect "$new_image" > /dev/null 2>&1; then
                echo "Skip existing image: $new_image"
                continue
              fi
            fi

            # 按需清理空间：仅当 /var/lib/docker 可用空间低于 12GB 时才执行 prune，保留公共基础层
            avail_mb=$(df -Pm /var/lib/docker | awk 'NR==2 {print $4}')
            if [ "$avail_mb" -lt 12288 ]; then
              echo "Low disk space (${avail_mb}MB), pruning unused images..."
              docker system prune -af
            fi

            echo "docker pull $line"
            docker pull $line
            echo "docker tag $image $new_image"
            docker tag "$image" "$new_image"
            echo "docker push $new_image"
            docker push "$new_image"

            # 仅移除新打的标签引用，保留底层镜像数据以复用公共 Layer
            docker rmi "$new_image" || true
          done < images.txt
